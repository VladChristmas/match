services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: match
      POSTGRES_PASSWORD: match
      POSTGRES_DB: match
    ports:
      - "5433:5432"
    volumes:
      - match-db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U match"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build:
      context: ../services/api
    environment:
      MATCH_ENVIRONMENT: docker
      MATCH_DATABASE_URL: postgresql+asyncpg://match:match@db:5432/match
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8000:8000"
    command: sh -c "alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port 8000"

volumes:
  match-db:
