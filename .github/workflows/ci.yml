name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  placeholder:
    name: scaffold-check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Repo layout check
        run: |
          test -d docs/architecture
          test -f README.md
          echo "Scaffold OK. Real CI jobs are added per roadmap stage."

  backend:
    name: backend (services/api)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install
        run: pip install -e ".[dev]"
      - name: Lint
        run: ruff check .
      - name: Tests
        run: pytest -q
