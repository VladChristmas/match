name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  placeholder:
    name: scaffold-check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Repo layout check
        run: |
          test -d docs/architecture
          test -f README.md
          echo "Scaffold OK. Real CI jobs are added per roadmap stage."

  backend:
    name: backend (services/api)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install
        run: pip install -e ".[dev]"
      - name: Format check
        run: ruff format --check .
      - name: Lint
        run: ruff check .
      - name: Tests
        run: pytest -q

  db-migrations:
    name: database (alembic up/down)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: match
          POSTGRES_PASSWORD: match
          POSTGRES_DB: match
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    defaults:
      run:
        working-directory: services/api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install
        run: pip install -e ".[dev]"
      - name: Migrate up
        env:
          MATCH_DATABASE_URL: postgresql+asyncpg://match:match@localhost:5432/match
        run: alembic upgrade head
      - name: Migrate down and up again
        env:
          MATCH_DATABASE_URL: postgresql+asyncpg://match:match@localhost:5432/match
        run: alembic downgrade base && alembic upgrade head
      - name: Show schema
        env:
          MATCH_DATABASE_URL: postgresql+asyncpg://match:match@localhost:5432/match
        run: alembic current
      # Тесты идут на in-memory SQLite; этот smoke гоняет рискованные пути
      # (dynamics, risk, compare) на реальном PostgreSQL — наивные/aware-даты,
      # типы колонок, JSON. Регрессия этапа 30: 500 на PostgreSQL при зелёных тестах.
      - name: PostgreSQL smoke (aware/naive datetimes, dynamics)
        env:
          MATCH_DATABASE_URL: postgresql+asyncpg://match:match@localhost:5432/match
          CI: "true"
        run: python scripts/pg_smoke.py

  desktop-web:
    name: desktop (web build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/desktop
    steps:
      - uses: actions/checkout@v4
      # Явная версия: pnpm/action-setup@v4 ищет packageManager только в корневом
      # package.json, которого в репозитории нет (поле — в apps/desktop).
      - uses: pnpm/action-setup@v4
        with:
          version: "12.14.0"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm
          cache-dependency-path: apps/desktop/pnpm-lock.yaml
      - name: Install
        run: pnpm install --frozen-lockfile
      - name: Type-check and build
        run: pnpm build

  desktop-rust:
    name: desktop (tauri shell)
    runs-on: windows-latest
    defaults:
      run:
        working-directory: apps/desktop
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: "12.14.0"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm
          cache-dependency-path: apps/desktop/pnpm-lock.yaml
      - name: Install frontend deps
        run: pnpm install --frozen-lockfile
      - name: Build frontend (needed by tauri context)
        run: pnpm build
      - name: Rust format check
        run: cargo fmt --manifest-path src-tauri/Cargo.toml --check
      - name: Rust lints
        run: cargo clippy --manifest-path src-tauri/Cargo.toml --all-targets -- -D warnings
      - name: Rust tests
        run: cargo test --manifest-path src-tauri/Cargo.toml
